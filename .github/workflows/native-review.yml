name: Anchor native review

on:
  workflow_dispatch:
    inputs:
      ios_only:
        description: Run only iPhone simulator qualification; skip Mac and Watch
        type: boolean
        default: false
      focused_mac_ui:
        description: Run only the two Today block-action macOS UI journeys; mutually exclusive with iOS only
        type: boolean
        default: false

concurrency:
  group: anchor-native-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Isolated Mac and iPhone journeys
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Validate requested scope
        env:
          IOS_ONLY: ${{ inputs.ios_only }}
          FOCUSED_MAC_UI: ${{ inputs.focused_mac_ui }}
        run: |
          if [ "$IOS_ONLY" = true ] && [ "$FOCUSED_MAC_UI" = true ]; then
            echo "focused_mac_ui and ios_only cannot both be enabled" >&2
            exit 2
          fi

      - name: Check out Anchor
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Verify shared package
        if: ${{ !inputs.ios_only && !inputs.focused_mac_ui }}
        run: |
          swift test --filter TimetableLayoutTests
          swift test
          swift build
          ./.build/debug/anchor-mcp --diagnose

      - name: Generate Xcode project
        working-directory: Apps
        run: xcodegen generate

      - name: Render every primary surface offscreen
        if: ${{ !inputs.ios_only && !inputs.focused_mac_ui }}
        env:
          CATALOG_OUTPUT: ${{ runner.temp }}/anchor-visual-catalog
        run: scripts/render-visual-catalog.sh "$CATALOG_OUTPUT"

      - name: Run complete macOS UI suite
        id: mac-ui
        if: ${{ !inputs.ios_only && !inputs.focused_mac_ui }}
        continue-on-error: true
        run: |
          npx -y xcodebuildmcp@2.7.0 macos test \
            --project-path Apps/Anchor.xcodeproj \
            --scheme "Anchor (macOS)" \
            --configuration DebugLocal \
            --derived-data-path "$RUNNER_TEMP/DerivedData-Mac-UI" \
            --output json > "$RUNNER_TEMP/anchor-mac-test.json"
          python3 - <<'PY'
          import json, os
          record = json.loads(open(os.environ["RUNNER_TEMP"] + "/anchor-mac-test.json").read())
          assert record["didError"] is False, record.get("error")
          summary = record["data"]["summary"]
          counts = summary["counts"]
          assert summary["status"] == "SUCCEEDED"
          assert counts["failed"] == 0 and counts["passed"] > 0
          PY

      - name: Run focused Today block-action macOS UI journeys
        id: mac-ui-focused
        if: ${{ !inputs.ios_only && inputs.focused_mac_ui }}
        continue-on-error: true
        run: |
          npx -y xcodebuildmcp@2.7.0 macos test \
            --json "$(python3 - <<'PYJSON'
          import json, os
          print(json.dumps({
              "projectPath": "Apps/Anchor.xcodeproj",
              "scheme": "Anchor (macOS)",
              "configuration": "DebugLocal",
              "derivedDataPath": os.environ["RUNNER_TEMP"] + "/DerivedData-Mac-UI-Focused",
              "extraArgs": [
                  "-only-testing:AnchorMacUITests/AnchorMacUITests/testMiniTimerStartsTheScheduledBlockWithoutRetypingIt",
                  "-only-testing:AnchorMacUITests/AnchorMacUITests/testTodayCreatesCompletesReviewsAndPersistsABlock"
              ]
          }))
          PYJSON
          )" --output json > "$RUNNER_TEMP/anchor-mac-focused-test.json"
          python3 - <<'PY'
          import json, os
          record = json.loads(open(os.environ["RUNNER_TEMP"] + "/anchor-mac-focused-test.json").read())
          expected = {
              "testMiniTimerStartsTheScheduledBlockWithoutRetypingIt",
              "testTodayCreatesCompletesReviewsAndPersistsABlock",
          }
          assert record["didError"] is False, record.get("error")
          data = record["data"]
          assert data["summary"]["status"] == "SUCCEEDED"
          assert data["summary"]["counts"] == {"passed": 2, "failed": 0, "skipped": 0}
          assert {case["test"].removesuffix("()") for case in data["testCases"] if case["status"] == "passed"} == expected
          PY

      # The width-specific method runs in the required 390-point step below.
      # Every pre-existing iPhone test, including generic compact controls, stays here.
      - name: Run iPhone UI suite on iPhone 17 Pro
        id: ios-ui
        if: ${{ !inputs.focused_mac_ui }}
        continue-on-error: true
        run: |
          npx -y xcodebuildmcp@2.7.0 simulator test \
            --json "$(python3 - <<'PYJSON'
          import json, os
          print(json.dumps({
              "projectPath": "Apps/Anchor.xcodeproj",
              "scheme": "Anchor (iOS)",
              "configuration": "DebugLocal",
              "simulatorName": "iPhone 17 Pro",
              "derivedDataPath": os.environ["RUNNER_TEMP"] + "/DerivedData-iOS-UI",
              "extraArgs": [
                  "-skip-testing:AnchorIOSUITests/AnchorIOSUITests/testTodayCompactControlsRemainReadableAndReachableOnPhone390",
                  "-skip-testing:AnchorIOSUITests/AnchorIOSUITests/testTodayLongLabelsEmptyDayOnPhone390",
                  "-skip-testing:AnchorIOSUITests/AnchorIOSUITests/testTodayLongLabelsEnabledDayOnPhone390"
              ]
          }))
          PYJSON
          )" --output json > "$RUNNER_TEMP/anchor-ios-test.json"
          python3 - <<'PY'
          import json, os
          record = json.loads(open(os.environ["RUNNER_TEMP"] + "/anchor-ios-test.json").read())
          assert record["didError"] is False, record.get("error")
          summary = record["data"]["summary"]
          counts = summary["counts"]
          assert summary["status"] == "SUCCEEDED"
          assert counts["failed"] == 0 and counts["passed"] > 0
          PY

      - name: Verify Today controls on an actual 390-point iPhone
        id: ios-ui-390
        if: ${{ !inputs.focused_mac_ui }}
        continue-on-error: true
        run: |
          npx -y xcodebuildmcp@2.7.0 simulator test \
            --json "$(python3 - <<'PYJSON'
          import json, os
          print(json.dumps({
              "projectPath": "Apps/Anchor.xcodeproj",
              "scheme": "Anchor (iOS)",
              "configuration": "DebugLocal",
              "simulatorName": "iPhone 16e",
              "derivedDataPath": os.environ["RUNNER_TEMP"] + "/DerivedData-iOS-390",
              "extraArgs": [
                  "-only-testing:AnchorIOSUITests/AnchorIOSUITests/testTodayCompactControlsRemainReadableAndReachableOnPhone390",
                  "-only-testing:AnchorIOSUITests/AnchorIOSUITests/testDayCanBeCopiedWithoutReplacingTheOriginal",
                  "-only-testing:AnchorIOSUITests/AnchorIOSUITests/testTodayLongLabelsEmptyDayOnPhone390",
                  "-only-testing:AnchorIOSUITests/AnchorIOSUITests/testTodayLongLabelsEnabledDayOnPhone390"
              ]
          }))
          PYJSON
          )" --output json > "$RUNNER_TEMP/anchor-ios390-test.json"

      - name: Capture the qualified 390-point Today surface
        id: ios-render-390
        if: ${{ !inputs.focused_mac_ui && steps.ios-ui-390.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 - <<'PYPROOF'
          import hashlib, json, os, pathlib, plistlib, shutil, struct, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          evidence = root / "anchor-native-evidence" / "phone-390"
          evidence.mkdir(parents=True, exist_ok=True)

          def tool(label, *args, payload=None):
              command = ["npx", "-y", "xcodebuildmcp@2.7.0", *args]
              if payload is not None:
                  command += ["--json", json.dumps(payload)]
              command += ["--output", "json"]
              result = subprocess.run(command, check=False, capture_output=True, text=True)
              (evidence / (label + ".stdout.txt")).write_text(result.stdout)
              (evidence / (label + ".stderr.txt")).write_text(result.stderr)
              assert result.returncode == 0, label + " failed; inspect retained diagnostics"
              record = json.loads(result.stdout)
              (evidence / (label + ".json")).write_text(json.dumps(record, indent=2))
              assert not record.get("didError"), record.get("error")
              return record["data"]

          test_record = json.loads((root / "anchor-ios390-test.json").read_text())
          (evidence / "tests.json").write_text(json.dumps(test_record, indent=2))
          assert test_record["didError"] is False, test_record.get("error")
          test_data = test_record["data"]
          assert test_data["summary"]["status"] == "SUCCEEDED"
          assert test_data["summary"]["counts"] == {"passed": 4, "failed": 0, "skipped": 0}
          passed_names = {case["test"].removesuffix("()")
                          for case in test_data["testCases"] if case["status"] == "passed"}
          assert {
              "testTodayCompactControlsRemainReadableAndReachableOnPhone390",
              "testDayCanBeCopiedWithoutReplacingTheOriginal",
              "testTodayLongLabelsEmptyDayOnPhone390",
              "testTodayLongLabelsEnabledDayOnPhone390"
          } == passed_names, "All four selected journeys must actually execute and pass without skips"
          devices = tool("simulators", "simulator", "list")["simulators"]
          candidates = [d for d in devices if d["name"] == "iPhone 16e" and d["isAvailable"]]
          requested_id = test_record.get("data", {}).get("request", {}).get("simulatorId")
          if requested_id:
              candidates = [d for d in candidates if d["simulatorId"] == requested_id]
          assert len(candidates) == 1, "Require the exact unambiguous iPhone 16e destination"
          device = candidates[0]
          simulator_id = device["simulatorId"]
          # Read only the named screenshot proofs written by our UI-test runner
          # on this exact hosted destination; do not export or expand XCResults.
          container_root = pathlib.Path.home() / "Library/Developer/CoreSimulator/Devices" / simulator_id / "data/Containers/Data/Application"
          expected_states = {
              "empty-day": ("testTodayLongLabelsEmptyDayOnPhone390", False),
              "enabled-day": ("testTodayLongLabelsEnabledDayOnPhone390", True),
              "copy-sheet": ("testTodayLongLabelsEnabledDayOnPhone390", True)
          }
          directories = list(container_root.glob("*/tmp/anchor-r3-390-evidence"))
          assert len(directories) == 1, "Require one unambiguous variant evidence directory on the tested simulator"
          variants = evidence / "variants"
          variants.mkdir(exist_ok=True)
          variant_receipts = []
          for state, (test_name, copy_enabled) in expected_states.items():
              name = "anchor-r3-390-" + state
              image = directories[0] / (name + ".png")
              metadata = directories[0] / (name + ".json")
              for proof_path in (image, metadata):
                  assert proof_path.is_file() and not proof_path.is_symlink(), "Missing or unsafe named variant proof"
                  assert proof_path.resolve().is_relative_to(container_root.resolve()), "Variant proof must remain inside the tested runner container"
              record = json.loads(metadata.read_text())
              assert record["testCase"] == test_name and record["scenario"] == state
              assert record["simulatorId"] == simulator_id, "The screenshots must come from the tested 390-point destination"
              assert abs(record["logicalWidth"] - 390) <= 0.5
              assert record["copyEnabled"] is copy_enabled
              assert record["imageName"] == image.name
              if state != "copy-sheet":
                  controls = record["controls"]
                  assert len(controls) == 3
                  for control, baseline in zip(controls, ("Copy day", "Log time", "Customize")):
                      assert control["label"].lower().count(baseline.lower()) == 2, "Unchanged English labels cannot qualify longer-label states"
                      assert control["frame"]["width"] >= 44 and control["frame"]["height"] >= 44
                  assert controls[0]["isEnabled"] is copy_enabled
                  assert all(c["isEnabled"] and c["isHittable"] for c in controls[1:])
                  assert not copy_enabled or controls[0]["isHittable"]
              image_bytes = image.read_bytes()
              assert image_bytes[:8] == b"\x89PNG\r\n\x1a\n" and image_bytes[12:16] == b"IHDR"
              width, height = struct.unpack(">II", image_bytes[16:24])
              assert width > 0 and height > 0
              shutil.copy2(image, variants / image.name)
              shutil.copy2(metadata, variants / metadata.name)
              variant_receipts.append({"scenario": state, "testCase": test_name,
                  "pngWidth": width, "pngHeight": height,
                  "imageSha256": hashlib.sha256(image_bytes).hexdigest(),
                  "metadataSha256": hashlib.sha256(metadata.read_bytes()).hexdigest()})
          (variants / "qualification.json").write_text(json.dumps({
              "headSha": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
              "simulatorId": simulator_id, "testCounts": test_data["summary"]["counts"],
              "passedNames": sorted(passed_names), "states": variant_receipts,
              "captureSource": "XCTest screenshots from the same passing variant journeys"
          }, indent=2))
          if device["state"] != "Booted":
              tool("boot", "simulator", "boot", "--simulator-id", simulator_id)
          app = tool("app-path", "simulator", "get-app-path",
              "--project-path", "Apps/Anchor.xcodeproj", "--scheme", "Anchor (iOS)",
              "--configuration", "DebugLocal", "--platform", "iOS Simulator",
              "--simulator-id", simulator_id,
              "--derived-data-path", str(root / "DerivedData-iOS-390"))
          app_path = pathlib.Path(app["artifacts"]["appPath"])
          with (app_path / "Info.plist").open("rb") as info_file:
              info = plistlib.load(info_file)
          assert info["CFBundleIdentifier"] == "com.significanthobbies.anchor"
          executable = app_path / info["CFBundleExecutable"]
          digest = hashlib.sha256(executable.read_bytes()).hexdigest()
          tool("install", "simulator", "install", "--simulator-id", simulator_id,
               "--app-path", str(app_path))
          tool("launch", "simulator", "launch-app", "--simulator-id", simulator_id,
               "--bundle-id", info["CFBundleIdentifier"], payload={"env": {
                   "ANCHOR_DEMO_DATA": "1", "ANCHOR_INITIAL_TAB": "today",
                   "ANCHOR_ONBOARDING_SKIP": "1",
                   "ANCHOR_STORE_PATH": "/tmp/anchor-390-proof-" + os.environ["GITHUB_RUN_ID"] + ".store"
               }})
          tool("ready", "ui-automation", "wait-for-ui", "--simulator-id", simulator_id,
               "--predicate", "exists", "--identifier", "anchor.today.customize", "--timeout-ms", "15000")
          screenshot = tool("screenshot", "simulator", "screenshot", "--simulator-id", simulator_id,
                            "--return-format", "path")
          image_path = pathlib.Path(screenshot["artifacts"]["screenshotPath"])
          shutil.copy2(image_path, evidence / ("today-390" + image_path.suffix))
          (evidence / "qualification.json").write_text(json.dumps({
              "headSha": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
              "simulator": device, "bundleId": info["CFBundleIdentifier"],
              "executableSha256": digest, "capture": screenshot["capture"],
              "imageIsScaledByMCP": screenshot["capture"]["format"] == "image/jpeg", "logicalWidthAssertionLivesInRequiredUITest": True
          }, indent=2))
          PYPROOF

      - name: Build watch companion
        id: watch-build
        if: ${{ !inputs.ios_only && !inputs.focused_mac_ui }}
        continue-on-error: true
        run: |
          xcodebuild \
            -project Apps/Anchor.xcodeproj \
            -scheme "Anchor (watchOS)" \
            -configuration DebugLocal \
            -destination "generic/platform=watchOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Watch" \
            build

      - name: Collect native evidence
        if: always()
        env:
          IOS_ONLY: ${{ inputs.ios_only }}
          FOCUSED_MAC_UI: ${{ inputs.focused_mac_ui }}
        run: |
          evidence_root="$RUNNER_TEMP/anchor-native-evidence"
          workspace_root="$HOME/Library/Developer/XcodeBuildMCP/workspaces"
          mkdir -p "$evidence_root"
          # Retain structured 390-point diagnostics even when qualification fails.
          if [ -f "$RUNNER_TEMP/anchor-ios390-test.json" ]; then
            cp "$RUNNER_TEMP/anchor-ios390-test.json" "$evidence_root/anchor-ios390-test.json"
          fi
          if [ -f "$RUNNER_TEMP/anchor-mac-focused-test.json" ]; then
            cp "$RUNNER_TEMP/anchor-mac-focused-test.json" "$evidence_root/anchor-mac-focused-test.json"
          fi
          for test_json in anchor-mac-test.json anchor-ios-test.json; do
            if [ -f "$RUNNER_TEMP/$test_json" ]; then
              cp "$RUNNER_TEMP/$test_json" "$evidence_root/$test_json"
            fi
          done
          if [ -d "$workspace_root" ]; then
            find "$workspace_root" -type d \( -name logs -o -name result-bundles \) -prune -print0 |
              while IFS= read -r -d '' evidence_dir; do
                workspace_name="$(basename "$(dirname "$evidence_dir")")"
                evidence_kind="$(basename "$evidence_dir")"
                ditto "$evidence_dir" "$evidence_root/$workspace_name/$evidence_kind"
              done
          fi
          # iPhone-only runs retain the standard and 390-point simulator results.
          result_count="$(find "$evidence_root" -type d -name '*.xcresult' -prune | wc -l | tr -d ' ')"
          required_results=3
          if [ "$IOS_ONLY" = true ]; then required_results=2; fi
          if [ "$FOCUSED_MAC_UI" = true ]; then required_results=1; fi
          test "$result_count" -ge "$required_results"

      - name: Upload page catalog and native evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: anchor-native-review-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/anchor-visual-catalog
            ${{ runner.temp }}/anchor-native-evidence

      - name: Enforce every native gate
        if: always()
        env:
          IOS_ONLY: ${{ inputs.ios_only }}
          FOCUSED_MAC_UI: ${{ inputs.focused_mac_ui }}
          MAC_UI_OUTCOME: ${{ steps.mac-ui.outcome }}
          MAC_UI_FOCUSED_OUTCOME: ${{ steps.mac-ui-focused.outcome }}
          IOS_UI_OUTCOME: ${{ steps.ios-ui.outcome }}
          IOS_UI_390_OUTCOME: ${{ steps.ios-ui-390.outcome }}
          IOS_RENDER_390_OUTCOME: ${{ steps.ios-render-390.outcome }}
          WATCH_BUILD_OUTCOME: ${{ steps.watch-build.outcome }}
        run: |
          if [ "$IOS_ONLY" != true ]; then
            if [ "$FOCUSED_MAC_UI" = true ]; then
              test "$MAC_UI_FOCUSED_OUTCOME" = success
            else
              test "$MAC_UI_OUTCOME" = success
              test "$WATCH_BUILD_OUTCOME" = success
            fi
          fi
          if [ "$FOCUSED_MAC_UI" != true ]; then
            test "$IOS_UI_OUTCOME" = success
            test "$IOS_UI_390_OUTCOME" = success
            test "$IOS_RENDER_390_OUTCOME" = success
          fi
