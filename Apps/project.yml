name: Anchor

options:
  bundleIdPrefix: com.significanthobbies
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
    watchOS: "26.0"
  groupSortPosition: top

configs:
  Debug: debug
  Release: release
  # Signed builds need this Mac registered in the developer account, which is a
  # one-time interactive step. DebugLocal drops entitlements and signing so the
  # Mac app still builds and runs before that happens — CloudKit sync is simply
  # off in that configuration, and the store falls back to local-only.
  DebugLocal: debug
  # Developer ID build for direct download (the DMG). Its provisioning profile
  # carries production CloudKit and app-group entitlements.
  ReleaseDirect: release

packages:
  AnchorPackage:
    # The shared Swift package one level up. Everything except the app shells
    # lives there, so the platforms stay genuinely identical.
    path: ..

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "20"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Real signing: CloudKit and the shared app group are entitlements, so they
    # only work against a provisioning profile. Automatic + the fleet team.
    DEVELOPMENT_TEAM: 8F7LXHTJZR
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  configs:
    DebugLocal:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ANCHOR_LOCAL_ONLY"

targets:
  AnchorMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
      - path: Shared
    dependencies:
      - package: AnchorPackage
        product: AnchorUI
      - package: AnchorPackage
        product: AnchorCore
    settings:
      base:
        PRODUCT_NAME: Anchor
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.anchor
        CODE_SIGN_ENTITLEMENTS: Mac/Anchor.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        DebugLocal:
          # Keep unsigned QA builds visibly and technically distinct from the
          # installed production app. Multiple identical Anchor bundles made a
          # local-only onboarding window look like the released build.
          PRODUCT_NAME: Anchor Local
          PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.anchor.local
          CODE_SIGN_ENTITLEMENTS: ""
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGNING_ALLOWED: NO
          DEVELOPMENT_TEAM: ""
          ENABLE_HARDENED_RUNTIME: NO
        ReleaseDirect:
          CODE_SIGN_ENTITLEMENTS: Mac/Anchor.DirectDistribution.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          PROVISIONING_PROFILE_SPECIFIER: "Anchor Developer ID"
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
    info:
      path: Mac/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - anchor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: ""
        # Not an agent app: Anchor has a real window as well as the menu bar.
        LSUIElement: false

  AnchorIOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    dependencies:
      - package: AnchorPackage
        product: AnchorUI
      - package: AnchorPackage
        product: AnchorCore
      # Embeds the watch app so a single iPhone install carries both.
      - target: AnchorWatch
        embed: true
      # Embeds the Live Activity widget extension for Lock Screen + Dynamic Island.
      - target: AnchorLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_NAME: Anchor
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.anchor
        CODE_SIGN_ENTITLEMENTS: iOS/Anchor.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        DebugLocal:
          CODE_SIGN_ENTITLEMENTS: ""
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGNING_ALLOWED: NO
          DEVELOPMENT_TEAM: ""
          ENABLE_HARDENED_RUNTIME: NO
    info:
      path: iOS/Info.plist
      properties:
        CFBundleName: Anchor
        CFBundleDisplayName: Anchor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - anchor
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # SwiftData's CloudKit mirror uses silent notifications to import
        # changes while the app is not frontmost.
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  AnchorWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    dependencies:
      - package: AnchorPackage
        product: AnchorUI
      - package: AnchorPackage
        product: AnchorCore
    settings:
      base:
        PRODUCT_NAME: Anchor
        # Must be the iPhone app's identifier plus `.watchkitapp` for the pairing
        # to be recognised.
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.anchor.watchkitapp
        CODE_SIGN_ENTITLEMENTS: Watch/Anchor.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
      configs:
        DebugLocal:
          CODE_SIGN_ENTITLEMENTS: ""
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGNING_ALLOWED: NO
          DEVELOPMENT_TEAM: ""
          ENABLE_HARDENED_RUNTIME: NO
    info:
      path: Watch/Info.plist
      properties:
        CFBundleName: Anchor
        CFBundleDisplayName: Anchor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.significanthobbies.anchor
        WKRunsIndependentlyOfCompanionApp: true
        # Wake the independent Watch app when CloudKit reports a remote change.
        UIBackgroundModes:
          - remote-notification

  AnchorLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
      # The extension links UserDefaults through shared focus state, so Apple's
      # required-reason policy requires its executable bundle to carry the same
      # declaration as the phone and watch apps.
      - path: Shared/PrivacyInfo.xcprivacy
    dependencies:
      - package: AnchorPackage
        product: AnchorUI
      - package: AnchorPackage
        product: AnchorCore
    settings:
      base:
        PRODUCT_NAME: Anchor Live Activity
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.anchor.live-activity
        CODE_SIGN_ENTITLEMENTS: ""
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
      configs:
        DebugLocal:
          CODE_SIGN_ENTITLEMENTS: ""
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGNING_ALLOWED: NO
          DEVELOPMENT_TEAM: ""
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Anchor Live Activity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  AnchorVisualCatalog:
    type: application
    platform: macOS
    sources:
      - path: VisualCatalog
      - path: Shared
    dependencies:
      - package: AnchorPackage
        product: AnchorUI
      - package: AnchorPackage
        product: AnchorCore
    settings:
      base:
        PRODUCT_NAME: Anchor Visual Catalog
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.anchor.visual-catalog
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
    info:
      path: VisualCatalog/Info.plist
      properties:
        CFBundleName: Anchor Visual Catalog
        CFBundleDisplayName: Anchor Visual Catalog
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHumanReadableCopyright: ""

  AnchorIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/AnchorIOSUITests
    dependencies:
      - target: AnchorIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.anchor.ui-tests
        GENERATE_INFOPLIST_FILE: YES
      configs:
        DebugLocal:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGNING_ALLOWED: NO
          DEVELOPMENT_TEAM: ""

  AnchorMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/AnchorMacUITests
    dependencies:
      - target: AnchorMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.significanthobbies.anchor.mac-ui-tests
        GENERATE_INFOPLIST_FILE: YES
      configs:
        DebugLocal:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGNING_ALLOWED: NO
          DEVELOPMENT_TEAM: ""

schemes:
  Anchor (macOS):
    build:
      targets:
        AnchorMac: all
        AnchorMacUITests: [test]
    test:
      targets:
        - AnchorMacUITests
    run:
      config: Debug
  Anchor (iOS):
    build:
      targets:
        AnchorIOS: all
        AnchorLiveActivity: all
        AnchorIOSUITests: [test]
    test:
      targets:
        - AnchorIOSUITests
    run:
      config: Debug
  Anchor (watchOS):
    build:
      targets:
        AnchorWatch: all
    run:
      config: Debug
  Anchor Visual Catalog:
    build:
      targets:
        AnchorVisualCatalog: all
    run:
      config: DebugLocal
